# Haven — a dark-first Material 3 Expressive theme for Home Assistant
# Created for Garrett, 2026-11-26. Deep background, lime accent (Portside echo).
# Install via HACS as a custom theme repository.

Haven:
  modes:
    dark:
      # Accent — lime, echoes Portside #A3E635
      primary-color: "#A3E635"
      accent-color: "#A3E635"
      dark-primary-color: "#84CC16"
      light-primary-color: "#D9F99D"

      # Backgrounds — near-black, Portside #0B0B0D
      primary-background-color: "#0B0B0D"
      secondary-background-color: "#131316"
      card-background-color: "#16161A"
      paper-card-background-color: "#16161A"
      paper-dialog-background-color: "#1B1B20"
      paper-listbox-background-color: "#16161A"

      # Text
      primary-text-color: "#F2F2ED"
      secondary-text-color: "#9A9AA3"
      text-primary-color: "#F2F2ED"
      disabled-text-color: "#5C5C66"

      # Dividers and borders
      divider-color: "#26262C"
      paper-input-container-color: "#9A9AA3"

      # Sidebar
      sidebar-background-color: "#0B0B0D"
      sidebar-icon-color: "#9A9AA3"
      sidebar-text-color: "#F2F2ED"
      sidebar-selected-icon-color: "#A3E635"
      sidebar-selected-text-color: "#A3E635"

      # Header
      app-header-background-color: "#0B0B0D"
      app-header-text-color: "#F2F2ED"

      # State icons
      state-icon-color: "#9A9AA3"
      state-icon-active-color: "#A3E635"
      state-icon-unavailable-color: "#F59E0B"
      paper-item-icon-color: "#9A9AA3"
      paper-item-icon-active-color: "#A3E635"

      # Switches and sliders
      switch-checked-color: "#A3E635"
      switch-checked-button-color: "#0B0B0D"
      switch-checked-track-color: "#3F6212"
      switch-unchecked-color: "#3A3A42"
      switch-unchecked-button-color: "#9A9AA3"
      switch-unchecked-track-color: "#26262C"
      slider-color: "#A3E635"
      slider-bar-color: "#2E2E35"

      # Badges and labels
      label-badge-background-color: "#16161A"
      label-badge-text-color: "#F2F2ED"
      label-badge-red: "#EF4444"
      label-badge-green: "#A3E635"
      label-badge-yellow: "#F59E0B"

      # Cards
      ha-card-border-radius: "18px"
      ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.45)"
      ha-card-border-width: "0px"

      # Dialogs and menus
      paper-dialog-color: "#F2F2ED"
      mdc-theme-surface: "#16161A"
      mdc-theme-on-surface: "#F2F2ED"

    light:
      # Accent — darker lime so it reads on white
      primary-color: "#65A30D"
      accent-color: "#65A30D"
      dark-primary-color: "#4D7C0F"
      light-primary-color: "#A3E635"

      # Backgrounds
      primary-background-color: "#F7F7F5"
      secondary-background-color: "#EFEFEC"
      card-background-color: "#FFFFFF"
      paper-card-background-color: "#FFFFFF"
      paper-dialog-background-color: "#FFFFFF"
      paper-listbox-background-color: "#FFFFFF"

      # Text
      primary-text-color: "#1A1A1C"
      secondary-text-color: "#6B6B74"
      text-primary-color: "#1A1A1C"
      disabled-text-color: "#A8A8B0"

      # Dividers and borders
      divider-color: "#E2E2DE"
      paper-input-container-color: "#6B6B74"

      # Sidebar
      sidebar-background-color: "#F7F7F5"
      sidebar-icon-color: "#6B6B74"
      sidebar-text-color: "#1A1A1C"
      sidebar-selected-icon-color: "#65A30D"
      sidebar-selected-text-color: "#65A30D"

      # Header
      app-header-background-color: "#F7F7F5"
      app-header-text-color: "#1A1A1C"

      # State icons
      state-icon-color: "#6B6B74"
      state-icon-active-color: "#65A30D"
      state-icon-unavailable-color: "#D97706"
      paper-item-icon-color: "#6B6B74"
      paper-item-icon-active-color: "#65A30D"

      # Switches and sliders
      switch-checked-color: "#65A30D"
      switch-checked-button-color: "#FFFFFF"
      switch-checked-track-color: "#D9F99D"
      switch-unchecked-color: "#C9C9C4"
      switch-unchecked-button-color: "#FFFFFF"
      switch-unchecked-track-color: "#E2E2DE"
      slider-color: "#65A30D"
      slider-bar-color: "#E2E2DE"

      # Badges and labels
      label-badge-background-color: "#FFFFFF"
      label-badge-text-color: "#1A1A1C"
      label-badge-red: "#DC2626"
      label-badge-green: "#65A30D"
      label-badge-yellow: "#D97706"

      # Cards
      ha-card-border-radius: "18px"
      ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.12)"
      ha-card-border-width: "0px"

      # Dialogs and menus
      paper-dialog-color: "#1A1A1C"
      mdc-theme-surface: "#FFFFFF"
      mdc-theme-on-surface: "#1A1A1C"
